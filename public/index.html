<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VJ Controller Pro</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; padding: 12px; background: #1a1a1a; color: #fff; height: 100vh; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    button { background: #333; color: #fff; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; }
    button:hover { background: #444; }
    .btn-window { background: #27ae60; }
    .main-layout { display: flex; flex: 1; gap: 12px; min-height: 0; }
    .mixer-grid { display: grid; grid-template-columns: 1fr 200px 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; flex: 1; min-height: 0; }
    .deck-box { background: #252525; padding: 8px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #333; transition: border 0.2s; min-height: 0; }
    .deck-box.dragover { border: 1px solid #27ae60; background: #2a352a; }
    .deck-title { font-size: 12px; font-weight: bold; color: #aaa; }
    .video-wrapper { position: relative; width: 100%; flex: 1; min-height: 0; background: #000; border-radius: 4px; overflow: hidden; }
    .video-wrapper.preview-wrapper { flex: none; aspect-ratio: 16 / 9; }
    video, canvas, .video-wrapper img { width: 100%; height: 100%; object-fit: contain; }
    .video-wrapper img { position: absolute; top: 0; left: 0; display: none; }
    video::-webkit-media-controls-fullscreen-button, video::-webkit-media-controls-picture-in-picture-button, video::-webkit-media-controls-aria-metadata-container { display: none !important; }
    .ctrl-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px; }
    .ctrl-row input[type="range"] { flex: 1; }
    .ctrl-row input[type="number"] { width: 50px; background: #333; color: #fff; border: 1px solid #444; border-radius: 3px; font-size: 11px; text-align: right; padding: 2px 4px; }
    .seek-btns { display: flex; gap: 2px; }
    .seek-btns button { padding: 2px 3px; font-size: 9px; background: #3a3a3a; border-radius: 2px; }
    .seek-btns button.fine { background: #005f9e; }
    .center-mixer { grid-column: 2; grid-row: 1 / span 2; background: #202020; padding: 8px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .fader-h { width: 100%; text-align: center; font-size: 11px; }
    .fader-v { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; flex: 0 0 auto; justify-content: center; }
    .vslider-wrap { width: 28px; height: 100px; display: flex; align-items: center; justify-content: center; }
    .vslider-wrap input[type="range"] {
      -webkit-appearance: slider-vertical; /* Chrome/Edge: ネイティブ縦スライダー。rotate変形を使わないためヒット判定のズレが発生しない */
      writing-mode: vertical-lr;
      direction: rtl; /* 上(AB)側が大きい値になるよう向きを反転 */
      width: 24px;
      height: 100px;
      margin: 0;
    }
    .side-panel { width: 280px; background: #222; padding: 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #333; }
    .dl-row, .list-header { display: flex; gap: 6px; align-items: center; font-size: 12px; }
    .dl-row input, .list-header input[type="text"] { background: #333; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 4px; font-size: 11px; flex: 1;}

    #video-list { flex: 1; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; scrollbar-width: thin; scrollbar-color: #555 #222; padding-bottom: 4px; }
    #video-list::-webkit-scrollbar { height: 10px; width: 10px; }
    #video-list::-webkit-scrollbar-track { background: #222; }
    #video-list::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
    #title-scrollbar { width: 100%; height: 14px; margin: 2px 0 6px; accent-color: #555; }
    .video-item { display: flex; align-items: center; background: #2a2a2a; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: grab; width: 100%; box-sizing: border-box; gap: 8px; }
    .video-item:active { cursor: grabbing; }
    .video-title-viewport { flex: 1; min-width: 0; overflow: hidden; }
    .video-title-track { display: inline-block; white-space: nowrap; }
    .video-title { font-size: 12px; }
    .btn-group { flex-shrink: 0; }

    .btn-group { display: flex; gap: 2px; }
    .btn-group button { padding: 2px 5px; font-size: 10px; margin-left: 2px; }
    .btn-del { background: #c0392b !important; } .btn-del:hover { background: #e74c3c !important; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #2c2c2c; padding: 20px; border-radius: 8px; width: 480px; max-height: 80vh; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .midi-map-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; background: #202020; padding: 6px; border-radius: 4px; }
  </style>
</head>
<body ondragover="event.preventDefault();" ondrop="handleGlobalDrop(event)">

  <div class="top-bar">
    <button class="btn-window" onclick="openStage()">window (画面投影)</button>
    <span id="stage-status" style="font-size:11px; color:#f66; font-family:monospace;">Stage: 未接続</span>
    <div style="display:flex; align-items:center; gap:8px;">
      <button id="btn-bpm" onclick="tapBPM()">Tap BPM</button>
      <span id="bpm-display" style="font-size:12px; color:#00d2ff; font-weight:bold;">BPM: ---</span>
    </div>
    <button onclick="toggleModal(true)">設定 ⚙</button>
  </div>

  <div class="main-layout">
    <div class="mixer-grid">
      <!-- DECK A -->
      <div class="deck-box" id="deck-box-A" ondragover="dragOverDeck(event)" ondragleave="dragLeaveDeck(event)" ondrop="dropToDeck(event, 'A')">
        <div class="ctrl-row">
          <span class="deck-title">A</span>
          <div class="seek-btns">
            <button onclick="seek('A', -5)">-5s</button><button onclick="seek('A', -1)">-1s</button>
            <button class="fine" onclick="seek('A', -0.1)">-0.1s</button><button class="fine" onclick="seek('A', 0.1)">+0.1s</button>
            <button onclick="seek('A', 1)">+1s</button><button onclick="seek('A', 5)">+5s</button>
          </div>
        </div>
        <div class="video-wrapper"><video id="prevA" controls loop preload="metadata" decoding="async" controlsList="nodownload nofullscreen noremoteplayback"></video><img id="imgA" alt=""></div>
        <div class="ctrl-row">
          <span>元BPM</span><input type="number" id="baseBpmA" placeholder="---" oninput="onBaseBpmChange('A')">
          <span>TGT</span><input type="number" id="targetBpmA" placeholder="---" oninput="onTargetBpmChange('A')">
        </div>
        <div class="ctrl-row">
          <span>速度</span>
          <input type="range" id="rateFaderA" min="0.5" max="2.0" step="0.01" value="1" oninput="onRateFaderChange('A')">
          <input type="number" id="manualRateA" step="0.01" value="1.00" onchange="onManualRateChange('A')">
        </div>
      </div>

      <!-- 中央ミキサー -->
      <div class="center-mixer">
        <div style="width: 100%;">
          <div class="deck-title" style="text-align: center; margin-bottom: 4px;">表示プレビュー</div>
          <div class="video-wrapper preview-wrapper"><canvas id="masterCanvas"></canvas></div>
        </div>
        <div class="fader-h">
          <div>A ────■──── B</div>
          <input type="range" id="faderAB" min="0" max="1" step="0.01" value="0" oninput="updateMix()">
        </div>
        <div class="fader-v">
          <div>AB</div>
          <div class="vslider-wrap"><input type="range" id="faderABCD" min="0" max="1" step="0.01" value="1" oninput="updateMix()"></div>
          <div>CD</div>
        </div>
        <div class="fader-h">
          <div>C ────■──── D</div>
          <input type="range" id="faderCD" min="0" max="1" step="0.01" value="0" oninput="updateMix()">
        </div>
      </div>

      <!-- DECK B -->
      <div class="deck-box" id="deck-box-B" ondragover="dragOverDeck(event)" ondragleave="dragLeaveDeck(event)" ondrop="dropToDeck(event, 'B')">
        <div class="ctrl-row">
          <span class="deck-title">B</span>
          <div class="seek-btns">
            <button onclick="seek('B', -5)">-5s</button><button onclick="seek('B', -1)">-1s</button>
            <button class="fine" onclick="seek('B', -0.1)">-0.1s</button><button class="fine" onclick="seek('B', 0.1)">+0.1s</button>
            <button onclick="seek('B', 1)">+1s</button><button onclick="seek('B', 5)">+5s</button>
          </div>
        </div>
        <div class="video-wrapper"><video id="prevB" controls loop preload="metadata" decoding="async" controlsList="nodownload nofullscreen noremoteplayback"></video><img id="imgB" alt=""></div>
        <div class="ctrl-row">
          <span>元BPM</span><input type="number" id="baseBpmB" placeholder="---" oninput="onBaseBpmChange('B')">
          <span>TGT</span><input type="number" id="targetBpmB" placeholder="---" oninput="onTargetBpmChange('B')">
        </div>
        <div class="ctrl-row">
          <span>速度</span>
          <input type="range" id="rateFaderB" min="0.5" max="2.0" step="0.01" value="1" oninput="onRateFaderChange('B')">
          <input type="number" id="manualRateB" step="0.01" value="1.00" onchange="onManualRateChange('B')">
        </div>
      </div>

      <!-- DECK C & D -->
      <div class="deck-box" id="deck-box-C" ondrop="dropToDeck(event, 'C')"><div class="deck-title">C</div><div class="video-wrapper"><video id="prevC" controls loop preload="metadata" decoding="async"></video><img id="imgC" alt=""></div></div>
      <div class="deck-box" id="deck-box-D" ondrop="dropToDeck(event, 'D')"><div class="deck-title">D</div><div class="video-wrapper"><video id="prevD" controls loop preload="metadata" decoding="async"></video><img id="imgD" alt=""></div></div>
    </div>

    <!-- サイドパネル -->
    <div class="side-panel">
      <div style="font-weight: bold; font-size: 12px; color: #aaa;">YouTube DL</div>
      <div class="dl-row">
        <input type="text" id="yt-url" placeholder="YouTube URL">
        <button onclick="downloadYoutube()">DL</button>
      </div>
      <div id="dl-status" style="font-size: 10px; color: #f39c12; min-height: 14px;"></div>
      <hr style="border: 0; border-top: 1px solid #333; margin: 4px 0;">
      <div class="list-header">
        <span style="font-weight: bold;">素材一覧</span>
        <button onclick="loadVideoList()" style="margin-left: auto;">更新</button>
      </div>
      <input type="text" id="search-box" placeholder="キーワード検索" oninput="filterList()">
      <label style="font-size: 10px; display: flex; align-items: center; gap: 4px;">
        <input type="checkbox" id="show-used" onchange="filterList()"> 非表示素材も表示
      </label>
      <div id="video-list"></div>
      <input type="range" id="title-scrollbar" min="0" max="0" value="0" step="1" oninput="applyTitleScroll()" disabled>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3>環境 ＆ コントローラー設定</h3>
      <div id="midi-status" style="font-size: 12px; color: #00d2ff;">MIDI機器の接続を確認中...</div>
      <h4>キーボードマッピング</h4>
      <div class="midi-map-item"><span>タップBPM</span><button onclick="learnKey('tap')">学習 (現在: <span id="key-tap">Space</span>)</button></div>
      <div class="midi-map-item"><span>フェーダーAB 左</span><button onclick="learnKey('fadeLeft')">学習 (現在: <span id="key-fadeLeft">ArrowLeft</span>)</button></div>
      <div class="midi-map-item"><span>フェーダーAB 右</span><button onclick="learnKey('fadeRight')">学習 (現在: <span id="key-fadeRight">ArrowRight</span>)</button></div>
      <h4>MIDIマッピング割り当て</h4>
      <div class="midi-map-item"><span>A-B クロスフェーダー</span><button id="btn-learn-faderAB" onclick="startMidiLearn('faderAB')">学習開始</button></div>
      <div class="midi-map-item"><span>AB-CD グループフェーダー</span><button id="btn-learn-faderABCD" onclick="startMidiLearn('faderABCD')">学習開始</button></div>
      <button onclick="toggleModal(false)" style="margin-top: 10px;">閉じる</button>
    </div>
  </div>

  <script>
    const decks = { A: document.getElementById('prevA'), B: document.getElementById('prevB'), C: document.getElementById('prevC'), D: document.getElementById('prevD') };
    const deckImgs = { A: document.getElementById('imgA'), B: document.getElementById('imgB'), C: document.getElementById('imgC'), D: document.getElementById('imgD') };
    let deckIsImage = { A: false, B: false, C: false, D: false };
    let allFiles = []; let hiddenFiles = new Set();

    function isImageFile(file) { return /\.(png|jpe?g|webp|gif)$/i.test(file); }
    function getActiveEl(deck) { return deckIsImage[deck] ? deckImgs[deck] : decks[deck]; }
    function isDeckReady(deck) {
      const el = getActiveEl(deck);
      return deckIsImage[deck] ? (el.complete && el.naturalWidth > 0) : el.readyState >= 2;
    }

    Object.keys(decks).forEach(key => {
      const v = decks[key];
      v.preservesPitch = false; v.mozPreservesPitch = false; v.webkitPreservesPitch = false;
    });

    let tapTimes = [];
    function tapBPM() {
      const now = performance.now();
      tapTimes.push(now);
      if (tapTimes.length > 4) tapTimes.shift();
      if (tapTimes.length > 1) {
        const intervals = [];
        for (let i = 1; i < tapTimes.length; i++) intervals.push(tapTimes[i] - tapTimes[i-1]);
        const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
        document.getElementById('bpm-display').innerText = `BPM: ${Math.round(60000 / avgInterval)}`;
      }
    }

    let stageWin = null;
    let stageReady = false;
    const stageStatusEl = document.getElementById('stage-status');
    function setStageStatus(text, ok) {
      if (stageStatusEl) {
        stageStatusEl.textContent = 'Stage: ' + text;
        stageStatusEl.style.color = ok ? '#4f4' : '#f66';
      }
    }
    function openStage() {
      if (stageWin && !stageWin.closed) { stageWin.focus(); return; }
      stageReady = false;
      setStageStatus('起動中(READY待ち)...', false);
      stageWin = window.open('/static/stage.html', 'VJStage', 'width=1280,height=720');
      console.log('[controller] window.open結果:', stageWin ? 'ウィンドウ取得成功' : 'null(ポップアップブロックの可能性)');
      if (!stageWin) {
        setStageStatus('起動失敗(ポップアップブロック?)', false);
      }
    }

    window.addEventListener('message', (e) => {
        if (!e.data) return;
        if (e.data.type === 'STAGE_READY' || e.data.type === 'STAGE_PING') {
            const wasReady = stageReady;
            stageWin = e.source;
            stageReady = true;
            if (!wasReady) {
              console.log('[controller]', e.data.type, '受信、Stage接続確立');
              setStageStatus('接続済み(送信中)', true);
            }
        }
    });

    function toggleModal(show) { document.getElementById('settingsModal').style.display = show ? 'flex' : 'none'; }
    function seek(deck, sec) { if (decks[deck] && !deckIsImage[deck]) decks[deck].currentTime = Math.max(0, decks[deck].currentTime + sec); }

    function onBaseBpmChange(deck) {
      const base = parseFloat(document.getElementById(`baseBpm${deck}`).value);
      if (!base) return;
      document.getElementById(`targetBpm${deck}`).value = Math.round(base * parseFloat(document.getElementById(`rateFader${deck}`).value));
    }
    function onTargetBpmChange(deck) {
      const base = parseFloat(document.getElementById(`baseBpm${deck}`).value);
      const target = parseFloat(document.getElementById(`targetBpm${deck}`).value);
      if (base && target) setRate(deck, target / base, true);
    }
    function onRateFaderChange(deck) {
      const rate = parseFloat(document.getElementById(`rateFader${deck}`).value);
      const base = parseFloat(document.getElementById(`baseBpm${deck}`).value);
      if (base) document.getElementById(`targetBpm${deck}`).value = Math.round(base * rate);
      setRate(deck, rate, false);
    }
    function onManualRateChange(deck) {
      let rate = parseFloat(document.getElementById(`manualRate${deck}`).value);
      if (isNaN(rate)) rate = 1.0;
      rate = Math.min(Math.max(rate, 0.1), 5.0);
      const base = parseFloat(document.getElementById(`baseBpm${deck}`).value);
      if (base) document.getElementById(`targetBpm${deck}`).value = Math.round(base * rate);
      setRate(deck, rate, true);
    }
    function setRate(deck, rate, updateFader = true) {
      if (updateFader) document.getElementById(`rateFader${deck}`).value = Math.min(Math.max(rate, 0.5), 2.0);
      document.getElementById(`manualRate${deck}`).value = rate.toFixed(2);
      if (decks[deck]) decks[deck].playbackRate = rate;
    }

    function getCurvedABCD(raw) { return 1 - Math.pow(1 - raw, 3); }

    let mixStates = { ab: 0, cd: 0, abcd: 1 };
    function updateMix() {
      mixStates.ab = parseFloat(document.getElementById('faderAB').value) || 0;
      mixStates.cd = parseFloat(document.getElementById('faderCD').value) || 0;
      mixStates.abcd = getCurvedABCD(parseFloat(document.getElementById('faderABCD').value) || 0);
    }
    updateMix();

    const offCanvas = document.createElement('canvas');
    offCanvas.width = 1280;
    offCanvas.height = 720;
    const offCtx = offCanvas.getContext('2d', { alpha: false });

    let ctrlRect = { width: 320, height: 180 };
    const ctrlCanvas = document.getElementById('masterCanvas');
    const ctrlCtx = ctrlCanvas.getContext('2d', { alpha: false });

    function updateRect() {
        const rect = ctrlCanvas.parentElement.getBoundingClientRect();
        if (rect.width > 0) ctrlRect = rect;
    }
    window.addEventListener('resize', updateRect);
    setTimeout(updateRect, 100);

    let lastRenderTime = 0;
    let bitmapInFlight = false;
    let lastStageSend = 0;
    let lastCompositeTime = 0;
    const STAGE_FRAME_INTERVAL = 1000 / 60; // Stageへの転送は60fps上限に固定(モニターのリフレッシュレートに引きずられない)
    const COMPOSITE_INTERVAL = 1000 / 60;   // 4デッキ合成描画も60fps上限に固定(高リフレッシュレートモニターでの過負荷を防止)

    // 静止画/GIFは元のアスペクト比を保って中央配置(レターボックス)、動画は従来通り全面表示
    function drawDeck(deck, alpha, w, h) {
      const el = getActiveEl(deck);
      offCtx.globalAlpha = alpha;
      if (deckIsImage[deck]) {
        const nw = el.naturalWidth, nh = el.naturalHeight;
        if (!nw || !nh) return;
        const scale = Math.min(w / nw, h / nh);
        const dw = nw * scale, dh = nh * scale;
        offCtx.drawImage(el, (w - dw) / 2, (h - dh) / 2, dw, dh);
      } else {
        offCtx.drawImage(el, 0, 0, w, h);
      }
    }

    function renderMasterPreview(time) {
      requestAnimationFrame(renderMasterPreview);

      const isControllerFrame = (time - lastRenderTime > 33);
      if (isControllerFrame) lastRenderTime = time;

      const isCompositeFrame = (time - lastCompositeTime >= COMPOSITE_INTERVAL);
      if (isCompositeFrame) lastCompositeTime = time;

      const w = 1280;
      const h = 720;

      if (isCompositeFrame) {
        const alphaA = (1 - mixStates.ab) * mixStates.abcd;
        const alphaB = mixStates.ab * mixStates.abcd;
        const alphaC = (1 - mixStates.cd) * (1 - mixStates.abcd);
        const alphaD = mixStates.cd * (1 - mixStates.abcd);

        offCtx.fillStyle = '#000';
        offCtx.fillRect(0, 0, w, h);
        offCtx.imageSmoothingEnabled = true;
        offCtx.imageSmoothingQuality = 'high';

        if (alphaA > 0.01 && isDeckReady('A')) drawDeck('A', alphaA, w, h);
        if (alphaB > 0.01 && isDeckReady('B')) drawDeck('B', alphaB, w, h);
        if (alphaC > 0.01 && isDeckReady('C')) drawDeck('C', alphaC, w, h);
        if (alphaD > 0.01 && isDeckReady('D')) drawDeck('D', alphaD, w, h);
      }

      if (stageWin && stageReady && !bitmapInFlight && (time - lastStageSend >= STAGE_FRAME_INTERVAL)) {
          let alive = true;
          try { alive = !stageWin.closed; } catch (err) { alive = false; }
          if (!alive) {
              stageWin = null; stageReady = false;
              setStageStatus('未接続', false);
              console.warn('[controller] Stageウィンドウが閉じられたため送信停止');
          } else {
              bitmapInFlight = true;
              lastStageSend = time;
              createImageBitmap(offCanvas).then(bmp => {
                  try {
                      stageWin.postMessage({ type: 'FRAME', bitmap: bmp }, '*', [bmp]);
                  } catch (err) {
                      bmp.close();
                      stageWin = null; stageReady = false;
                      setStageStatus('未接続(送信エラー)', false);
                      console.error('[controller] postMessage失敗:', err);
                  }
              }).catch((err) => { console.error('[controller] createImageBitmap失敗:', err); }).finally(() => { bitmapInFlight = false; });
          }
      }

      if (isControllerFrame) {
          if (ctrlCanvas.width !== ctrlRect.width) {
              ctrlCanvas.width = ctrlRect.width; ctrlCanvas.height = ctrlRect.height;
          }
          ctrlCtx.globalAlpha = 1.0;
          ctrlCtx.drawImage(offCanvas, 0, 0, ctrlCanvas.width, ctrlCanvas.height);
      }
    }
    requestAnimationFrame(renderMasterPreview);

    function sendMedia(file, deck) {
      const url = `/videos/${encodeURIComponent(file)}`;
      const videoEl = decks[deck];
      const imgEl = deckImgs[deck];
      if (isImageFile(file)) {
        deckIsImage[deck] = true;
        videoEl.pause(); videoEl.removeAttribute('src'); videoEl.load();
        videoEl.style.display = 'none';
        imgEl.src = url;
        imgEl.style.display = 'block';
      } else {
        deckIsImage[deck] = false;
        imgEl.style.display = 'none';
        imgEl.removeAttribute('src');
        videoEl.style.display = '';
        videoEl.src = url;
        videoEl.load();
      }
      hiddenFiles.add(file); filterList();
    }

    function hideMedia(file) { hiddenFiles.add(file); filterList(); }

    let dlInterval = null;
    async function downloadYoutube() {
      const url = document.getElementById('yt-url').value;
      if (!url) return;
      await fetch('/api/download', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ url }) });
      document.getElementById('yt-url').value = '';
      if (dlInterval) clearInterval(dlInterval);
      dlInterval = setInterval(async () => {
        const res = await fetch('/api/progress');
        const data = await res.json();
        const statusEl = document.getElementById('dl-status');
        if (data.progress) {
          statusEl.innerText = data.progress;
        } else {
          statusEl.innerText = 'DL完了！'; clearInterval(dlInterval); loadVideoList(); setTimeout(() => statusEl.innerText = '', 3000);
        }
      }, 1000);
    }

    async function loadVideoList() { const res = await fetch('/api/videos', { cache: 'no-store' }); allFiles = (await res.json()).videos; filterList(); }

    let draggedFile = null;
    function onListDragStart(e, file) { draggedFile = file; e.dataTransfer.setData('text/plain', file); }
    function onListDrop(e, targetFile) {
      e.preventDefault(); e.stopPropagation();
      if (draggedFile && draggedFile !== targetFile) {
        allFiles.splice(allFiles.indexOf(draggedFile), 1);
        allFiles.splice(allFiles.indexOf(targetFile), 0, draggedFile);
        filterList();
      }
      draggedFile = null;
    }

    function filterList() {
      const q = document.getElementById('search-box').value.toLowerCase();
      const showUsed = document.getElementById('show-used').checked;
      const listDiv = document.getElementById('video-list');
      listDiv.innerHTML = '';

      allFiles.filter(f => f.toLowerCase().includes(q))
              .filter(f => showUsed || !hiddenFiles.has(f))
              .forEach(file => {
        const item = document.createElement('div');
        item.className = 'video-item'; item.draggable = true;
        item.ondragstart = (e) => onListDragStart(e, file); item.ondragover = (e) => e.preventDefault(); item.ondrop = (e) => onListDrop(e, file);

        item.innerHTML = `
          <div class="video-title-viewport"><div class="video-title-track"><span class="video-title" title="${file}">${file}</span></div></div>
          <div class="btn-group">
            <button onclick="sendMedia('${file}', 'A')">A</button><button onclick="sendMedia('${file}', 'B')">B</button>
            <button onclick="sendMedia('${file}', 'C')">C</button><button onclick="sendMedia('${file}', 'D')">D</button>
            <button class="btn-del" onclick="hideMedia('${file}')">×</button>
          </div>
        `;
        listDiv.appendChild(item);
      });
      updateTitleScrollRange();
    }

    // 素材一覧: タイトルだけを1本の共通スクロールバーで一括スクロール(ボタン群はこの窓の外側にあるため位置が変わらない)
    function updateTitleScrollRange() {
      const tracks = document.querySelectorAll('.video-title-track');
      const scrollbar = document.getElementById('title-scrollbar');
      let maxOverflow = 0;
      tracks.forEach(track => {
        const viewport = track.parentElement;
        const overflow = track.scrollWidth - viewport.clientWidth;
        if (overflow > maxOverflow) maxOverflow = overflow;
      });
      scrollbar.max = maxOverflow;
      scrollbar.disabled = maxOverflow <= 0;
      if (parseFloat(scrollbar.value) > maxOverflow) scrollbar.value = maxOverflow;
      applyTitleScroll();
    }

    function applyTitleScroll() {
      const x = parseFloat(document.getElementById('title-scrollbar').value) || 0;
      document.querySelectorAll('.video-title-track').forEach(track => {
        track.style.transform = `translateX(-${x}px)`;
      });
    }

    window.addEventListener('resize', updateTitleScrollRange);

    async function uploadFile(file, deck = null) {
      const formData = new FormData(); formData.append('file', file);
      const res = await (await fetch('/api/upload', { method: 'POST', body: formData })).json();
      await loadVideoList();
      if (deck) sendMedia(res.filename, deck);
    }
    function handleGlobalDrop(e) { e.preventDefault(); if (e.dataTransfer.files.length > 0) uploadFile(e.dataTransfer.files[0]); }
    function dragOverDeck(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }
    function dragLeaveDeck(e) { e.currentTarget.classList.remove('dragover'); }
    function dropToDeck(e, deck) {
      e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) uploadFile(e.dataTransfer.files[0], deck);
      else if (e.dataTransfer.getData('text/plain')) sendMedia(e.dataTransfer.getData('text/plain'), deck);
    }

    let keyConfig = { tap: 'Space', fadeLeft: 'ArrowLeft', fadeRight: 'ArrowRight' };
    let keyLearningTarget = null;
    function learnKey(action) { keyLearningTarget = action; document.getElementById(`key-${action}`).innerText = '入力待ち...'; }
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
      if (keyLearningTarget) { e.preventDefault(); keyConfig[keyLearningTarget] = e.code; document.getElementById(`key-${keyLearningTarget}`).innerText = e.code; keyLearningTarget = null; return; }
      if (e.code === keyConfig.tap) { e.preventDefault(); tapBPM(); }
      const fAB = document.getElementById('faderAB');
      if (e.code === keyConfig.fadeLeft) { fAB.value = Math.max(0, parseFloat(fAB.value) - 0.05); updateMix(); }
      if (e.code === keyConfig.fadeRight) { fAB.value = Math.min(1, parseFloat(fAB.value) + 0.05); updateMix(); }
    });

    loadVideoList();
  </script>
</body>
</html>
