name: 機能提案
description: 新機能や改善案を提案します
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。実装方法だけでなく、解決したい課題を中心に記載してください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 現在どのような場面で困っているかを説明してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能
      description: 希望する操作や動作を説明してください。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 何ができればこのIssueを完了とみなせるかを箇条書きで記載してください。
      placeholder: |
        - [ ] コントローラー画面で…できる
        - [ ] 投影画面に…が反映される
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別の方法や現在の回避策があれば記載してください。

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: 参考画像、関連Issue、外部資料などがあれば記載してください。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認事項
      options:
        - label: 既存Issueに同じ提案がないことを確認しました
          required: true
