name: バグ報告
description: 再現可能な不具合を報告します
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。調査できるよう、分かる範囲で具体的に記載してください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 発生している問題を簡潔に説明してください。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題を再現する操作を順番に記載してください。
      placeholder: |
        1. サーバーを起動する
        2. コントローラー画面で…
        3. …すると問題が発生する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージがある場合は、秘密情報を除いて貼り付けてください。
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 対象バージョンまたはコミット
      placeholder: v0.1.0 / c2b2949

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: ブラウザー
      placeholder: Chrome / Edge / Safari

  - type: input
    id: python
    attributes:
      label: Pythonバージョン
      placeholder: Python 3.10.14

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: スクリーンショット、ログ、発生頻度などを記載してください。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認事項
      options:
        - label: 既存Issueに同じ内容がないことを確認しました
          required: true
        - label: ログや添付ファイルから秘密情報・個人情報を削除しました
          required: true
