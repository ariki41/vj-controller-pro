name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Check application import
        run: python -c "import main"

      - name: Check application version
        run: python -c "import main; assert main.app.version == open('VERSION', encoding='utf-8').read().strip()"

  build-windows:
    name: Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name vj-controller-pro
          --add-data "public:public"
          --add-data "VERSION:."
          main.py

      - name: Verify executable version
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $actualVersion = (& .\dist\vj-controller-pro.exe --version | Out-String).Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version $actualVersion does not match VERSION $expectedVersion."
          }
