name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Check application import
        run: python -c "import main"

      - name: Check application version
        run: python -c "import main; assert main.app.version == open('VERSION', encoding='utf-8').read().strip()"

      - name: Generate Windows version resource
        run: python scripts/generate_windows_version_info.py

  build-windows:
    name: Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify published signing certificate
        shell: pwsh
        run: |
          $expectedThumbprint = "743A44349826D9D8C7367487FBBD81BE74E5C34B"
          $certificate = Get-PfxCertificate -FilePath ".\certs\vj-controller-pro-code-signing.cer"
          $actualThumbprint = ($certificate.Thumbprint -replace "\s", "").ToUpperInvariant()
          if ($actualThumbprint -ne $expectedThumbprint) {
            throw "Unexpected signing certificate thumbprint: $actualThumbprint"
          }
          if ($certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
            throw "The published signing certificate has expired."
          }

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\scripts\install_windows_signing_certificate.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            throw "Certificate installer script contains PowerShell syntax errors: $parseErrors"
          }

      - name: Test certificate trust installer
        shell: pwsh
        run: |
          $expectedThumbprint = "743A44349826D9D8C7367487FBBD81BE74E5C34B"
          $scriptPath = ".\scripts\install_windows_signing_certificate.ps1"
          try {
            & $scriptPath -CertificatePath ".\certs\vj-controller-pro-code-signing.cer"
            foreach ($storeName in @("TrustedPeople", "TrustedPublisher")) {
              $installedPath = "Cert:\CurrentUser\$storeName\$expectedThumbprint"
              if (-not (Test-Path -LiteralPath $installedPath)) {
                throw "The installer did not add the certificate to $storeName."
              }
            }
          } finally {
            & $scriptPath -Remove
          }

      - name: Generate Windows version resource
        run: python scripts/generate_windows_version_info.py

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name vj-controller-pro
          --version-file "build/windows-version-info.txt"
          --add-data "public:public"
          --add-data "VERSION:."
          main.py

      - name: Verify executable version
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $actualVersion = (& .\dist\vj-controller-pro.exe --version | Out-String).Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version $actualVersion does not match VERSION $expectedVersion."
          }

          $versionInfo = (Get-Item .\dist\vj-controller-pro.exe).VersionInfo
          if ($versionInfo.ProductName -ne "VJ Controller Pro") {
            throw "Unexpected product name: $($versionInfo.ProductName)"
          }
          if ($versionInfo.ProductVersion -ne $expectedVersion) {
            throw "Executable product version $($versionInfo.ProductVersion) does not match VERSION $expectedVersion."
          }
