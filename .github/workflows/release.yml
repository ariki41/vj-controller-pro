name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Verify tag and VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($expectedTag)."
          }

      - name: Verify SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $requiredValues = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
          }
          $missingValues = @($requiredValues.Keys | Where-Object {
            [string]::IsNullOrWhiteSpace($requiredValues[$_])
          })
          if ($missingValues.Count -gt 0) {
            throw "SignPath configuration is incomplete: $($missingValues -join ', ')"
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Generate Windows version resource
        run: python scripts/generate_windows_version_info.py

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name vj-controller-pro
          --version-file "build/windows-version-info.txt"
          --add-data "public:public"
          --add-data "VERSION:."
          main.py

      - name: Verify executable version
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $actualVersion = (& .\dist\vj-controller-pro.exe --version | Out-String).Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version $actualVersion does not match VERSION $expectedVersion."
          }

          $versionInfo = (Get-Item .\dist\vj-controller-pro.exe).VersionInfo
          if ($versionInfo.ProductName -ne "VJ Controller Pro") {
            throw "Unexpected product name: $($versionInfo.ProductName)"
          }
          if ($versionInfo.ProductVersion -ne $expectedVersion) {
            throw "Executable product version $($versionInfo.ProductVersion) does not match VERSION $expectedVersion."
          }

      - name: Upload unsigned artifact for SignPath
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: vj-controller-pro-unsigned-${{ github.sha }}
          path: .\dist\vj-controller-pro.exe
          if-no-files-found: error
          retention-days: 1
          archive: false

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ github.workspace }}\dist-signed
          skip-decompress: true

      - name: Verify signed executable
        shell: pwsh
        run: |
          $signedPath = ".\dist-signed\vj-controller-pro.exe"
          if (-not (Test-Path $signedPath)) {
            throw "Signed executable was not downloaded from SignPath."
          }

          $signature = Get-AuthenticodeSignature $signedPath
          if ($signature.Status -ne "Valid") {
            throw "Authenticode signature is not valid: $($signature.StatusMessage)"
          }

          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $actualVersion = (& $signedPath --version | Out-String).Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Signed executable version $actualVersion does not match VERSION $expectedVersion."
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:GITHUB_REF_NAME already exists."
            exit 0
          }

          if ($env:GITHUB_REF_NAME.Contains("-")) {
            gh release create $env:GITHUB_REF_NAME .\dist-signed\vj-controller-pro.exe --title $env:GITHUB_REF_NAME --generate-notes --verify-tag --prerelease
          } else {
            gh release create $env:GITHUB_REF_NAME .\dist-signed\vj-controller-pro.exe --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
