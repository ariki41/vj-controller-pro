name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Build and create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Verify tag and VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($expectedTag)."
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name vj-controller-pro
          --add-data "public:public"
          --add-data "VERSION:."
          main.py

      - name: Verify executable version
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $actualVersion = (& .\dist\vj-controller-pro.exe --version | Out-String).Trim()
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version $actualVersion does not match VERSION $expectedVersion."
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:GITHUB_REF_NAME already exists."
            exit 0
          }

          if ($env:GITHUB_REF_NAME.Contains("-")) {
            gh release create $env:GITHUB_REF_NAME .\dist\vj-controller-pro.exe --title $env:GITHUB_REF_NAME --generate-notes --verify-tag --prerelease
          } else {
            gh release create $env:GITHUB_REF_NAME .\dist\vj-controller-pro.exe --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
          }

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
