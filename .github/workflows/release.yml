name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Verify tag and VERSION
        shell: bash
        run: |
          expected_tag="v$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected_tag})."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate application version
        run: python -c "import main; assert main.app.version == open('VERSION', encoding='utf-8').read().strip()"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi

          release_options=(
            "${GITHUB_REF_NAME}"
            --title "${GITHUB_REF_NAME}"
            --generate-notes
            --verify-tag
          )

          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_options+=(--prerelease)
          fi

          gh release create "${release_options[@]}"
